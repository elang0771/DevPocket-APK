name: Publish verified DevPocket v1.0.64 (one-time bridge)
on:
  push:
    paths:
      - .github/workflows/publish-v1.0.64-once.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download signed APK artifact and verify SHA-256
        env:
          SOURCE_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-1024-8211-85b0-fe9713cbbb16/raw?se=2026-10-12T16%3A45%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=bb3be03e-c1e7-5b90-a3f0-89cdbf0e6515&skoid=54865dd2-31dc-44cc-a877-635aa4250446&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T01%3A26%3A36Z&ske=2026-10-13T01%3A26%3A36Z&sks=b&skv=2026-02-06&sig=CFz9LjLbcA%2BHdyIqOlO9%2BU3qCXxvwcu4O6QvnhAnupQ%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error "$SOURCE_URL" --output signed-artifact.zip
          test "$(unzip -Z1 signed-artifact.zip | wc -l)" -eq 1
          unzip -p signed-artifact.zip app-release.apk > DevPocket-v1.0.64.apk
          echo "d35ec70d4220bda772e06d6aa1c65cc0ecc69c923db60b59987e239b1993da8e  DevPocket-v1.0.64.apk" | sha256sum -c -
          test "$(stat -c %s DevPocket-v1.0.64.apk)" -eq 841106
      - name: Publish APK as public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v1.0.64 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo 'Release v1.0.64 already exists; leaving it unchanged.'
            exit 0
          fi
          gh release create v1.0.64 DevPocket-v1.0.64.apk \
            --repo "${{ github.repository }}" \
            --title 'DevPocket v1.0.64 (10064)' \
            --notes 'Verified signed Android APK. DevPocket PR #43: Prompt Generator, AI Chat image recovery, direct UI visual and DSML fixes. Source code/signing keys remain private.'

name: Publish DevPocket signed v1.0.63 (one-time bridge)
on:
  push:
    paths:
      - .github/workflows/publish-v1.0.63-once.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch private build signed APK via temporary approved transfer
        env:
          SOURCE_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-63f4-8211-b702-9f955d34e32e/raw?se=2026-10-11T09%3A01%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=e8b2695b-a664-58bc-ae58-8f9972195a2f&skoid=54865dd2-31dc-44cc-a877-635aa4250446&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T02%3A58%3A18Z&ske=2026-10-12T02%3A58%3A18Z&sks=b&skv=2026-02-06&sig=ci%2B6elkBY4p%2BDNG%2B8RflfIelS2uMWH1x6kMxGdZelOA%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error "$SOURCE_URL" --output artifact.zip
          unzip -p artifact.zip app-release.apk > DevPocket-v1.0.63.apk
          echo "f3af33e22c975eae537b4866e3b483f5813957460c66abc22006846c9efd314b  DevPocket-v1.0.63.apk" | sha256sum -c -
      - name: Publish signed Android APK only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create v1.0.63 DevPocket-v1.0.63.apk \
            --repo "${{ github.repository }}" \
            --title "DevPocket v1.0.63 (10063)" \
            --notes "Signed Android release. Token-free app updates via DevPocket-APK public releases. The application source, signing keys, and private migration builds are NOT included."

name: Publish signed DevPocket APK
on:
  push:
    paths:
      - .github/workflows/publish-apk.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download signed release artifact
        env:
          SOURCE_URL: "https://sdmntprseasia.oaiusercontent.com/files/00000000-8a50-8207-af7b-678a9cee2004/raw?se=2026-10-11T04%3A08%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=c2d24ae0-8ccb-5c82-abf3-d3e3869a679c&skoid=54865dd2-31dc-44cc-a877-635aa4250446&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T02%3A17%3A02Z&ske=2026-10-12T02%3A17%3A02Z&sks=b&skv=2026-02-06&sig=kwfjBXVf8WpE6ySJVhkYEF1BtoAAS2kGxqtd8Q4eU10%3D"
        run: |
          curl --fail --location --retry 3 --silent --show-error "$SOURCE_URL" --output artifact.zip
          unzip -p artifact.zip app-release.apk > DevPocket-v1.0.59.apk
          echo "2f7e673448575ebb1d30b80dcd79a33296e87206a9bbdcd903f9a26e5ab36557  DevPocket-v1.0.59.apk" | sha256sum -c -
      - name: Publish public APK link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.59 DevPocket-v1.0.59.apk --repo "${{ github.repository }}" --title "DevPocket v1.0.59 (10059)" --notes "Signed release APK for Android phones and Samsung Galaxy Tab. Source code is not included."
